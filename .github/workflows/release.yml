name: Test, build and release plasmoid

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publications so two consecutive merges cannot select the same tag.
concurrency:
  group: plasmoid-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Qt test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Install calendar test dependencies
        run: python -m pip install -r package/contents/code/requirements-calendar.txt
      - name: Run core tests
        run: ./scripts/test-core.sh
      - name: Build and validate package
        run: |
          python3 scripts/package.py
          python3 scripts/validate-package.py --qml

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Select version
        id: version
        run: echo "version=$(python3 scripts/release_version.py)" >> "$GITHUB_OUTPUT"
      - name: Build versioned package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/package.py --version "$VERSION"
          python3 scripts/validate-package.py "build/boring-island-$VERSION.plasmoid"
          sha256sum "build/boring-island-$VERSION.plasmoid" > build/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # A retry must not overwrite a previously published release.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it unchanged."
          else
            gh release create "v$VERSION" "build/boring-island-$VERSION.plasmoid" build/SHA256SUMS \
              --target "$TARGET_SHA" --title "Boring Island $VERSION" --generate-notes --fail-on-no-commits
          fi
